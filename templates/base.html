<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}BotHoster - Платформа управления ботами{% endblock %}</title>

    <link rel="stylesheet" href="{{ url_for('static', path='/css/style.css') }}">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.11"></script>
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/" hx-get="/" hx-target="#main-content" hx-push-url="true">
                🤖 BotHoster
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/bots" hx-get="/bots" hx-target="#main-content" hx-push-url="true">Мои боты</a>
                <a class="nav-link" href="/profile" hx-get="/profile" hx-target="#main-content" hx-push-url="true">Профиль</a>
            </div>
        </div>
    </nav>

    <!-- Основной контент -->
    <main class="container" id="main-content">
        {% block content %}{% endblock %}
    </main>

    <!-- Контейнер для всплывающих тостов (OOB Swap) -->
    <div id="toast-container" class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1090;"></div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Перехватчик ошибок HTMX (4xx / 5xx) -->
    <script>
        document.body.addEventListener("htmx:responseError", function(evt) {
            const xhr = evt.detail.xhr;
            const toastContainer = document.getElementById("toast-container");
            
            let message = "Произошла ошибка при выполнении запроса";
            if (xhr.status === 404) message = "Ресурс не найден (404)";
            if (xhr.status === 500) message = "Внутренняя ошибка сервера (500)";
            if (xhr.status === 403) message = "Доступ запрещен (403)";

            toastContainer.insertAdjacentHTML("beforeend", `
                <div class="toast show align-items-center text-bg-danger border-0 mb-2" role="alert">
                    <div class="d-flex">
                        <div class="toast-body">${message}</div>
                        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
                    </div>
                </div>
            `);
        });
    </script>
</body>
</html>
